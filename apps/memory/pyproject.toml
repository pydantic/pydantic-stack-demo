[project]
name = "memory"
version = "0.1.0"
description = "Two ways to give a Pydantic AI agent persistent memory in Postgres: stored message history, and record/retrieve tools"
requires-python = ">=3.12"
dependencies = ["demo-core", "pydantic-ai>=2.43", "asyncpg>=0.30", "logfire[asyncpg]>=5.0"]

[project.scripts]
memory-messages = "memory.with_messages:main"
memory-tools = "memory.with_tools:main"

[tool.uv.sources]
demo-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory"]

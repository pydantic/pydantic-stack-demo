[project]
name = "mcp-sampling"
version = "0.1.0"
description = "Pydantic AI as MCP client and MCP server, with the server borrowing the client's model through MCP sampling"
requires-python = ">=3.12"
dependencies = ["demo-core", "pydantic-ai>=2.43", "mcp>=1.26,<2", "fastmcp-slim[client]>=3.3,<4", "logfire>=5.0"]

[project.scripts]
mcp-sampling-client = "mcp_sampling.client:main"

[tool.uv.sources]
demo-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_sampling"]

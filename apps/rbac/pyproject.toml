[project]
name = "rbac"
version = "0.1.0"
description = "Who can see and send what: audit a Logfire organization's roles, tokens and API keys through the Platform API"
requires-python = ">=3.12"
dependencies = [
    "demo-core",
    "httpx>=0.27",
    "logfire>=5.0",
    "pydantic>=2.10",
]

[project.scripts]
rbac-audit = "rbac.audit:main"
rbac-tokens = "rbac.tokens:main"

[tool.uv.sources]
demo-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rbac"]

[project]
name = "gateway-routing"
version = "0.1.0"
description = "One Gateway key, many providers: routing, failover, budgets per tenant, and keeping PII out of traces"
requires-python = ">=3.12"
dependencies = [
    "demo-core",
    "pydantic-ai>=2.43",
    "pydantic-ai-harness>=0.31",
    "logfire>=5.0",
]

[project.scripts]
gateway-routing-providers = "gateway_routing.providers:main"
gateway-routing-fallback = "gateway_routing.fallback:main"
gateway-routing-budgets = "gateway_routing.budgets:main"
gateway-routing-privacy = "gateway_routing.privacy:main"

[tool.uv.sources]
demo-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_routing"]

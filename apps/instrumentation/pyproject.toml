[project]
name = "instrumentation"
version = "0.1.0"
description = "A FastAPI service instrumented end to end with Logfire: auto-instrumentation, manual spans, structured logs, metrics, scrubbing and sampling"
requires-python = ">=3.12"
dependencies = [
    "demo-core",
    "pydantic-ai>=2.43",
    "logfire[fastapi,httpx,system-metrics]>=5.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.scripts]
instrumentation-serve = "instrumentation.main:serve"
instrumentation-traffic = "instrumentation.traffic:main"

[tool.uv.sources]
demo-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/instrumentation"]

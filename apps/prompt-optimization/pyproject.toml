[project]
name = "prompt-optimization"
version = "0.1.0"
description = "Automated prompt optimization with GEPA, Pydantic AI and Pydantic Evals"
requires-python = ">=3.12"
dependencies = [
    "demo-core",
    "pydantic>=2.10",
    "pydantic-ai>=2.43",
    "pydantic-evals>=2.43",
    "logfire>=5.0",
    "gepa>=0.0.27",
    "tqdm>=4.66",
]

[project.scripts]
prompt-optimization = "prompt_optimization.cli:main"

[tool.uv.sources]
demo-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_optimization"]

[project]
name = "distributed-frontend"
version = "0.1.0"
description = "Distributed tracing from a React browser app into a FastAPI backend and a Pydantic AI agent, with the Logfire token kept server-side"
requires-python = ">=3.12"
dependencies = [
    "demo-core",
    "pydantic-ai>=2.43",
    "logfire[fastapi,httpx]>=5.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.scripts]
distributed-frontend-backend = "distributed_frontend.main:serve"

[tool.uv.sources]
demo-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/distributed_frontend"]

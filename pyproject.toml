[project]
name = "pydantic-stack-demo"
version = "0.2.0"
description = "Runnable demos of the Pydantic stack: Pydantic AI, Pydantic Evals, AI Gateway and Logfire"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[dependency-groups]
dev = [
    "ruff>=0.12.2",
    "basedpyright>=1.31.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "asyncpg-stubs>=0.30.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# importlib mode keeps same-named test modules in different apps from colliding.
addopts = "--import-mode=importlib"
testpaths = ["packages", "apps"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["apps/distributed-frontend/frontend"]

[tool.ruff.lint]
extend-select = ["Q", "RUF100", "C90", "UP", "I"]
flake8-quotes = { inline-quotes = "single", multiline-quotes = "double" }
isort = { combine-as-imports = true, known-first-party = ["demo_core"] }
mccabe = { max-complexity = 15 }

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = false
quote-style = "single"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportUnnecessaryTypeIgnoreComment = true
venv = ".venv"
venvPath = "."
include = ["packages", "apps"]
exclude = [".git", ".venv", "**/node_modules", "**/frontend", "scratch"]

[tool.codespell]
ignore-words-list = "ans"

[project]
name = "demo-core"
version = "0.1.0"
description = "Shared helpers for the pydantic-stack-demo apps: settings, Logfire setup, model helpers, FastAPI factory, eval helpers"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "logfire[fastapi,httpx,system-metrics]>=5.0",
    "pydantic-ai>=2.43",
    "pydantic-evals>=2.43",
    "fastapi>=0.115",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_core"]
